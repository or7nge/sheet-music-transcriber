<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sheet Music Transcriber</title>
    <meta
      name="description"
      content="Upload sheet music and transcribe it into notes, MIDI, and MusicXML."
    />
    <link rel="stylesheet" href="/styles.css?v=streamlined-20260319" />
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <p class="eyebrow">Optical Music Recognition</p>
        <h1>Sheet Music Transcriber</h1>
        <p class="lede">
          Upload one score and get a clean transcription workflow without the extra UI overhead.
        </p>
      </header>

      <section class="workspace">
        <article class="panel">
          <div class="panel-head">
            <div>
              <p class="panel-label">Input</p>
              <h2>Run a Transcription</h2>
            </div>
            <p id="fileMetaHint">Choose one score to transcribe</p>
          </div>

          <label for="fileInput" id="dropzone" class="dropzone">
            <input id="fileInput" type="file" accept=".jpg,.jpeg,.png,.pdf" hidden />
            <span class="dropzone-kicker">Drop JPG, PNG, or PDF</span>
            <strong>Click to upload</strong>
            <span>High-resolution scans work best. Multi-page PDFs currently use page 1.</span>
          </label>

          <div class="input-actions">
            <button id="pasteImageButton" class="secondary" type="button">Paste image</button>
            <span>or press Cmd/Ctrl+V</span>
          </div>

          <div id="fileChip" class="file-chip" hidden>
            <div id="fileName" class="file-name"></div>
            <div id="fileMeta" class="file-meta"></div>
          </div>

          <div class="progress-wrap">
            <div class="progress-track">
              <div id="progressBar" class="progress-bar"></div>
            </div>
            <p id="progressText" class="progress-text">Waiting for a file.</p>
          </div>
        </article>

        <article id="historyPanel" class="panel panel-results">
          <div class="panel-head">
            <div>
              <p class="panel-label">Output</p>
              <h2>Transcriptions</h2>
            </div>
            <p>Newest first</p>
          </div>
          <div id="historyList" class="history-list" aria-live="polite"></div>
        </article>
      </section>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="/app.js?v=streamlined-20260319" defer></script>
  </body>
</html>
